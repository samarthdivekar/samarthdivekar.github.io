<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>3D check</title>
<script>
  window.__esmShim = !(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'));
  if (window.__esmShim) {
    window.esmsInitOptions = { shimMode: false };
    document.write('<script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.1/dist/es-module-shims.js"><\/script>');
  }
</script>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
</script>
<style>
  body { margin: 0; padding: 18px; background: #050505; color: #ededed;
         font: 14px/1.5 ui-monospace, monospace; }
  h1 { margin: 0 0 14px; font-size: 17px; color: #c6ff3d; }
  .row { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid #1c1c1c; }
  .k { flex: 0 0 132px; color: #8a8a8a; }
  .v { flex: 1; word-break: break-word; }
  .ok { color: #c6ff3d; } .bad { color: #ff5f5f; } .wait { color: #8a8a8a; }
  canvas { width: 100%; height: 190px; margin-top: 16px; border: 1px solid #1c1c1c; display: block; }
  p.note { color: #8a8a8a; font-size: 12px; }
</style>
</head>
<body>
<h1>Portfolio 3D check</h1>
<div id="out"></div>
<canvas id="c"></canvas>
<p class="note">A spinning green cloud of dots below means 3D works on this phone. Screenshot this page and send it over.</p>

<script type="module">
const out = document.getElementById('out');
const rows = {};
function line(k, v, cls) {
  if (!rows[k]) {
    const d = document.createElement('div');
    d.className = 'row';
    d.innerHTML = '<div class="k"></div><div class="v"></div>';
    d.children[0].textContent = k;
    out.appendChild(d);
    rows[k] = d.children[1];
  }
  rows[k].textContent = v;
  rows[k].className = 'v ' + (cls || '');
}

line('browser', navigator.userAgent);
line('screen', innerWidth + '×' + innerHeight + ' @' + devicePixelRatio + 'x');
line('import maps', window.__esmShim ? 'NOT supported — using shim' : 'native', window.__esmShim ? 'bad' : 'ok');

const gl2 = document.createElement('canvas').getContext('webgl2');
const gl1 = gl2 || document.createElement('canvas').getContext('webgl');
line('WebGL2', gl2 ? 'yes' : (gl1 ? 'no (WebGL1 only)' : 'NO WEBGL AT ALL'), gl2 ? 'ok' : 'bad');
if (gl1) {
  const dbg = gl1.getExtension('WEBGL_debug_renderer_info');
  if (dbg) line('GPU', gl1.getParameter(dbg.UNMASKED_RENDERER_WEBGL));
  line('float buffers', gl1.getExtension('EXT_color_buffer_half_float') ? 'yes' : 'no',
       gl1.getExtension('EXT_color_buffer_half_float') ? 'ok' : 'bad');
}

line('three.js', 'loading…', 'wait');
(async () => {
  let THREE, EffectComposer, RenderPass, UnrealBloomPass, OutputPass;
  try {
    let imp = (s) => import(s);
    if (window.__esmShim) {
      for (let i = 0; i < 100 && !window.importShim; i++) await new Promise(r => setTimeout(r, 50));
      if (!window.importShim) throw new Error('shim never loaded');
      imp = (s) => window.importShim(s);
    }
    THREE = await imp('three');
    line('three.js', 'loaded r' + THREE.REVISION, 'ok');
    ({ EffectComposer } = await imp('three/addons/postprocessing/EffectComposer.js'));
    ({ RenderPass } = await imp('three/addons/postprocessing/RenderPass.js'));
    ({ UnrealBloomPass } = await imp('three/addons/postprocessing/UnrealBloomPass.js'));
    ({ OutputPass } = await imp('three/addons/postprocessing/OutputPass.js'));
    line('add-ons', 'loaded', 'ok');
  } catch (e) {
    line('three.js', 'FAILED — ' + e.message, 'bad');
    return;
  }

  const canvas = document.getElementById('c');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(canvas.clientWidth, 190, false);
    line('renderer', 'created', 'ok');
  } catch (e) {
    line('renderer', 'FAILED — ' + e.message, 'bad');
    return;
  }

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#050505');
  const camera = new THREE.PerspectiveCamera(40, canvas.clientWidth / 190, 0.1, 50);
  camera.position.z = 4;

  // a small version of the real particle cloud, same shader ingredients
  const N = 4000, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, r = Math.sqrt(1 - u * u);
    pos.set([r * Math.cos(t) * 1.3, u * 1.3, r * Math.sin(t) * 1.3], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const points = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xc6ff3d, size: 0.02 }));
  scene.add(points);

  let composer = null;
  try {
    composer = new EffectComposer(renderer);
    composer.setSize(canvas.clientWidth, 190);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(canvas.clientWidth, 190), 0.55, 0.35, 0.42));
    composer.addPass(new OutputPass());
    composer.render();
    line('glow pass', 'works', 'ok');
  } catch (e) {
    composer = null;
    line('glow pass', 'FAILED (site falls back) — ' + e.message, 'bad');
  }

  let frames = 0, t0 = performance.now();
  (function loop() {
    points.rotation.y += 0.006;
    if (composer) { try { composer.render(); } catch (e) { composer = null; } }
    if (!composer) renderer.render(scene, camera);
    frames++;
    const dt = performance.now() - t0;
    if (dt > 1000) { line('frame rate', Math.round(frames / (dt / 1000)) + ' fps', 'ok'); frames = 0; t0 = performance.now(); }
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
